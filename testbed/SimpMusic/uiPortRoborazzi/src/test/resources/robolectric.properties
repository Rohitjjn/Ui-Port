# Render at exactly the reference capture's physical size.
#
# Robolectric's default display is 320x470 dp regardless of the qualifiers, and the qualifiers
# only decide how the layout is computed — the PNG comes out at whatever the display says. With
# 393 x 852 dp at xhdpi (density 2) the expected image is 786 x 1704 px, which is what
# config/viewports.json declares for the phone target and what Playwright captures at.
#
# Keep these two in step: `sdk` here and the qualifiers in UiPortRoborazziTest.kt.
sdk=34
qualifiers=w393dp-h852dp-xhdpi
