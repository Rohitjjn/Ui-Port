# End-to-end checks against the test bed (SimpMusic, GPL-3.0, kept in testbed/).
#
# Heavy: manual dispatch only, plus pushes to main that touch the test bed or scripts.
# Delete this workflow together with testbed/ — see docs/CLEANUP.md.
name: ci-e2e-simpmusic

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gradle task to run against the test bed"
        default: ":androidApp:assembleDebug"
        type: string
  push:
    branches: [main]
    paths:
      - "testbed/SimpMusic/**"
      - "scripts/**"
  # Phase work happens on branches; the pull request is what proves the baseline build
  # before the branch is merged. Removing the testbed removes this trigger with it.
  pull_request:
    paths:
      - "testbed/SimpMusic/**"
      - "scripts/**"
      - ".github/workflows/ci-e2e-simpmusic.yml"

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: testbed/SimpMusic
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Write local.properties (no secrets)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Export library definitions
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Baseline build
        run: ./gradlew "${{ inputs.task || ':androidApp:assembleDebug' }}" --stacktrace

      # Prove the APK contains the ported UI before calling it a deliverable.
      #
      # "The build succeeded" and "the artifact shows the new interface" are different claims, and
      # only the first one is visible from a green job. The ported classes are compiled into
      # classes.dex, so they are greppable in the APK; the entry point is wired in MainActivity, so
      # its call site is greppable too. Without this a renamed class or a reverted wiring step would
      # ship an APK that looks fine and opens the old app.
      - name: Verify the APK contains the ported UI
        if: success()
        run: |
          set -e
          ls -l androidApp/build/outputs/apk/debug/*.apk
          # Prefer the universal APK: it is the one a person can install without knowing their
          # device's ABI, so it is the one the deliverable points at.
          apk=$(ls androidApp/build/outputs/apk/debug/*universal*.apk 2>/dev/null | head -1)
          if [ -z "$apk" ]; then
            echo "::warning title=apk::no universal APK was produced; verifying the first per-ABI APK instead"
            apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          else
            echo "::notice title=apk::universal APK found: $(basename "$apk")"
          fi
          echo "apk: $apk"
          ls -l "$apk"
          echo "sha256: $(sha256sum "$apk" | cut -d" " -f1)"
          echo "size_bytes: $(stat -c%s "$apk")"
          unzip -o -q "$apk" classes*.dex -d /tmp/apkdex
          for cls in UiPortApp UiPortHomeScreen UiPortLibraryScreen UiPortBottomNav; do
            if grep -lq "$cls" /tmp/apkdex/*.dex 2>/dev/null; then
              echo "::notice title=apk contents::$cls present in the dex"
            else
              echo "::error title=apk contents::$cls is NOT in the APK - the artifact does not contain the ported UI"
              exit 1
            fi
          done
          # The screens' own resources (the vendored typefaces) must be packaged too, or the port
          # renders in a fallback font and every measurement in this repo becomes meaningless.
          unzip -l "$apk" | grep -iE "uiport_(instrument_serif|inter)" | head -5 || {
            echo "::error title=apk contents::uiport fonts are missing from the APK"
            exit 1
          }
          echo "::notice title=apk verified::$(basename "$apk") contains the ported UI and its fonts"
          echo "::notice title=apk files::$(basename -a androidApp/build/outputs/apk/debug/*.apk | tr '\n' ' ')"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: simpmusic-debug-apk
          path: testbed/SimpMusic/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: APK checksum
        if: success()
        run: |
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -1)
          sha256sum "$apk" | tee /tmp/apk.sha256
          {
            echo "## APK"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| file | \`$(basename "$apk")\` |"
            echo "| size | $(stat -c%s "$apk") bytes |"
            echo "| sha256 | \`$(cut -d" " -f1 /tmp/apk.sha256)\` |"
            echo "| contains ported UI | yes (verified above) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build scan / reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: simpmusic-build-reports
          path: testbed/SimpMusic/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
