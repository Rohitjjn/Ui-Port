# End-to-end checks against the test bed (SimpMusic, GPL-3.0, kept in testbed/).
#
# Heavy: manual dispatch only, plus pushes to main that touch the test bed or scripts.
# Delete this workflow together with testbed/ — see docs/CLEANUP.md.
name: ci-e2e-simpmusic

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Gradle task to run against the test bed"
        default: ":androidApp:assembleDebug"
        type: string
  push:
    branches: [main]
    paths:
      - "testbed/SimpMusic/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: ci-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: testbed/SimpMusic
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Accept Android SDK licences
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Write local.properties (no secrets)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "isFullBuild=false" >> gradle.properties

      - name: Export library definitions
        run: ./gradlew exportLibraryDefinitions --stacktrace

      - name: Baseline build
        run: ./gradlew "${{ inputs.task || ':androidApp:assembleDebug' }}" --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-debug-apk
          path: testbed/SimpMusic/androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build scan / reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simpmusic-build-reports
          path: testbed/SimpMusic/**/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
